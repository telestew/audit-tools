<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plugin Manager</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="manager.css">
    <link rel="stylesheet" href="https://unpkg.com/codemirror@6.0.1/lib/codemirror.css">
    <link rel="stylesheet" href="https://unpkg.com/@codemirror/theme-one-dark@6.0.1/dist/index.css">
</head>
<body>
    <div class="centered">
        <h3>Plugin Manager</h3>
        <div class="theme-selector">
            Theme:
            <label><input type="radio" name="theme" value="light"> Light</label>
            <label><input type="radio" name="theme" value="dark"> Dark</label>
            <label><input type="radio" name="theme" value="auto"> Auto</label>
        </div>
    </div>
    <div id="plugin-list"></div>
    <div class="centered actions" style="margin-top: 30px;">
        <button id="add-plugin">Add New Plugin</button>
        <button id="add-group">Add Group Label</button>
        <button id="export-all" class="secondary">Export All</button>
        <label for="import-file" class="button secondary">Import Plugins</label>
        <input type="file" id="import-file" class="hidden" accept=".json">
        <button id="restore-defaults" class="secondary">Restore Defaults</button>
        <button id="clear-all-data" class="danger">Clear All Data</button>
    </div>
    <script src="https://unpkg.com/codemirror@6.0.1/lib/codemirror.js"></script>
    <script src="https://unpkg.com/@codemirror/lang-javascript@6.0.1/dist/index.js"></script>
    <script src="https://unpkg.com/@codemirror/lang-json@6.0.1/dist/index.js"></script>
    <script src="https://unpkg.com/@codemirror/lint@6.0.1/dist/index.js"></script>
    <script src="https://unpkg.com/@codemirror/theme-one-dark@6.0.1/dist/index.js"></script>
    <script src="manager.js"></script>
</body>
</html>
