<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plugin Manager</title>
    <link rel="icon" href="icon.png" type="image/x-icon">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="manager.css">
    <link rel="stylesheet" href="lib/codemirror/codemirror.css">
    <link rel="stylesheet" href="lib/codemirror/theme/juejin.css">
    <link rel="stylesheet" href="lib/codemirror/theme/monokai.css">
</head>
<body>
    <div class="topbar">
        <h1>Plugin Manager</h1>
        <div class="header-actions">
            <div class="toolbar-group">
                <button id="add-plugin">Add Plugin</button>
                <button id="add-group">Add Group</button>
            </div>
            <div class="toolbar-group">
                <button id="export-zip" class="secondary">Export Plugins ZIP</button>
                <label for="import-zip-file" class="button secondary">Import Plugins ZIP</label>
                <input type="file" id="import-zip-file" class="hidden" accept=".zip,application/zip">
                <button id="inspect-scripts" class="secondary">Inspect Scripts</button>
            </div>
            <div class="toolbar-group">
                <button id="restore-defaults" class="secondary">Restore Defaults</button>
                <button id="clear-all-data" class="danger">Clear Data</button>
            </div>
        </div>
    </div>

    <div class="theme-selector" style="margin-bottom: 20px;">
        Theme:
        <label><input type="radio" name="theme" value="light"> Light</label>
        <label><input type="radio" name="theme" value="dark"> Dark</label>
        <label><input type="radio" name="theme" value="auto"> Auto</label>
    </div>
    <div class="shortcut-mapper" style="margin-bottom: 20px; display: flex; gap: 15px; align-items: center; border: 1px solid var(--border-color); padding: 10px; border-radius: 4px;">
        <span>Shortcut Slots:</span>
        <select id="slot-kb_command_1"><option value="">Slot 1 (Alt+L)</option></select>
        <select id="slot-kb_command_2"><option value="">Slot 2 (Alt+K)</option></select>
        <select id="slot-kb_command_3"><option value="">Slot 3 (Alt+O)</option></select>
    </div>
    <div id="plugin-list"></div>
    <script src="lib/codemirror/codemirror.js"></script>
    <script src="lib/codemirror/mode/javascript.js"></script>
    <script src="manager.js"></script>
</body>
</html>
